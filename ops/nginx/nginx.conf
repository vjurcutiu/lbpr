worker_processes auto;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  gzip on;

  # WebSocket helper
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Upstreams
  upstream fastapi_upstream { server api:8000; keepalive 64; }

  # ---- HTTP (80): ACME + redirect to HTTPS ----
  server {
    listen 80;
    server_name lexbot.pro www.lexbot.pro;

    # Serve ACME challenges for webroot renewals
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      allow all;
    }

    # Everything else -> HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS (443): site + API proxy ----
  server {
    listen 443 ssl http2;
    server_name lexbot.pro www.lexbot.pro;

    # --- TLS certs (mounted read-only from host /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/lexbot.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexbot.pro/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ---- API → FastAPI
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Optional: versioned API mirror (your FastAPI also serves /v1/*)
    location /v1/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # WebSockets (if you use /ws/)
    location /ws/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # Streaming endpoints (if any)
    location /stream/ {
      proxy_pass http://fastapi_upstream;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # ---- Static: marketing (optional)
    location /mkt/ {
      alias /srv/marketing/;
      try_files $uri $uri/ =404;
    }

    # ---- SPA: serve built app and fall back to index.html
    root /srv/spa/dist;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
