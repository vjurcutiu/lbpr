  # ---------------- HTTPS: PROD (App + Apex) ----------------
  # This vhost now serves the SPA app for:
  #   - app.lexbot.pro
  #   - lexbot.pro
  #   - www.lexbot.pro
  server {
    listen 443 ssl;
    http2 on;
    server_name app.lexbot.pro lexbot.pro www.lexbot.pro;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Deny dotfiles & secrets, but allow normal SPA routes
    location ~ /\.(?!well-known).* { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    # API → FastAPI
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # Optional versioned API
    location /v1/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # WebSockets (if used)
    location /ws/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # SPA
    root /srv/spa/dist;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ /index.html; }
  }

  # ---------------- HTTPS: STAGING ----------------
  server {
    listen 443 ssl;
    http2 on;
    server_name staging.lexbot.pro;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Deny dotfiles & secrets, but allow normal SPA routes
    location ~ /\.(?!well-known).* { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    # API → FastAPI
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # SPA
    root /srv/spa/dist;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ /index.html; }
  }
}


