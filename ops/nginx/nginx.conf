worker_processes auto;

events {
  worker_connections 1024;
}

http {
  client_max_body_size 50m;
  client_body_timeout 300s;

  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream fastapi_upstream { server api:8000; keepalive 64; }

  include /etc/nginx/conf.d/cloudflare-real-ip.conf;

  server {
    listen 80 default_server;
    return 444;
  }

  server {
    listen 80;
    server_name lexbot.pro www.lexbot.pro app.lexbot.pro staging.lexbot.pro;
    location / { return 301 https://$host$request_uri; }
  }

  map $host $tls_cert { default /etc/ssl/cf-origin/lexbot.pro-origin.pem; }
  map $host $tls_key  { default /etc/ssl/cf-origin/lexbot.pro-origin.key; }

  server {
    listen 443 ssl default_server;
    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;
    return 444;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.lexbot.pro;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    return 301 https://lexbot.pro$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name lexbot.pro;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ~ /\.(?!well-known).* { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    location ^~ /api/ { return 404; }
    location ^~ /v1/  { return 404; }
    location ^~ /ws/  { return 404; }

    root /srv/marketing/dist;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name app.lexbot.pro;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location ~ /\.(?!well-known).* { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    location = /api/auth/magic/create     { return 404; }
    location = /api/v1/auth/magic/create  { return 404; }
    location = /v1/auth/magic/create      { return 404; }

    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    location /v1/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    location /ws/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    root /srv/spa/dist;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ /index.html; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name staging.lexbot.pro;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.(?!well-known).* { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    location = /api/auth/magic/create    { return 404; }
    location = /api/v1/auth/magic/create { return 404; }

    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    root /srv/spa/dist;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ /index.html; }
  }
}
