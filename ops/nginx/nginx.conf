worker_processes auto;

events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # Ensure modern module scripts get the right MIME (fixes "octet-stream" error)
  types {
    application/javascript js mjs;
    application/wasm wasm;
    text/css css;
  }

  # WebSocket upgrade helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream fastapi_upstream {
    server api:8000;
    keepalive 64;
  }

  # === DEFAULT HOST: lexbot.pro serves the SPA and proxies /api ===
  server {
    listen 80 default_server;
    server_name lexbot.pro www.lexbot.pro _;

    root /srv/spa/dist;
    index index.html;

    # cache hashed assets
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # WebSocket under /api/ws/*
    location /api/ws/ {
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_pass http://fastapi_upstream/ws/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # Server-Sent Events or streaming under /api/stream/*
    location /api/stream/ {
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_pass http://fastapi_upstream/stream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
    }

    # All other API calls under /api/*
    # NOTE the trailing slash on proxy_pass to map /api/foo -> /foo upstream
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
    }

    # SPA history fallback
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }

  # === Optional: localhost marketing (kept as a separate host) ===
  server {
    listen 80;
    server_name localhost;

    root /srv/marketing;
    index index.html;

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
  }

  # === Optional: api.localhost direct API host (unchanged) ===
  server {
    listen 80;
    server_name api.localhost;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /v1/ { proxy_pass http://fastapi_upstream; }

    location /ws/ {
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_pass http://fastapi_upstream;
    }

    location /stream/ {
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_pass http://fastapi_upstream;
    }

    location = /healthz { proxy_pass http://fastapi_upstream; }

    location / { proxy_pass http://fastapi_upstream; }
  }
}
