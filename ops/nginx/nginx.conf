worker_processes auto;

events { worker_connections 2048; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Rate limiting (per IP)
  limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
  limit_req_status 429;

  # Minimal UA block
  map $http_user_agent $blocked_agent {
    default 0;
    ~*CensysInspect 1;
    ~*zgrab        1;
    ~*Go-http-client 1;
    ~*^Hello,?\s*world 1;
  }

  # WebSocket helper
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Upstreams
  upstream fastapi_upstream { server api:8000; keepalive 64; }

  # ---- Cloudflare real IP restore ----
  include /etc/nginx/conf.d/cloudflare-real-ip.conf;

  # Default vhost: drop unknown hosts quickly
  server {
    listen 80 default_server;
    return 444;
  }

  # ---------------- HTTP (80): ACME + redirect ----------------
  server {
    listen 80;
    server_name lexbot.pro www.lexbot.pro staging.lexbot.pro;

    # ACME challenges (only needed if you use Let's Encrypt HTTP-01)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
      allow all;
    }

    # Everything else -> HTTPS
    location / { return 301 https://$host$request_uri; }
  }

  # ---------------- HTTPS: PRODUCTION (lexbot.pro) ----------------
  server {
    listen 443 ssl http2;
    server_name lexbot.pro www.lexbot.pro;

    # TLS certs (Let's Encrypt). Ensure certs exist for these names.
    ssl_certificate     /etc/letsencrypt/live/lexbot.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lexbot.pro/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # (Optional) Start CSP in Report-Only
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:;" always;

    # Global request guards
    if ($blocked_agent) { return 403; }
    limit_req zone=perip burst=20 nodelay;

    # Deny secrets & dotfiles
    location ~ /\.(?!well-known)(.*)$ { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    # Drop obvious CMS scanners quickly
    location ~* ^/(wp-admin|wp-includes|wp-content|xmlrpc\.php|administrator|user/login|index\.php) { return 444; }

    # API → FastAPI
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Optional: versioned API mirror
    location /v1/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # WebSockets (if used)
    location /ws/ {
      proxy_pass http://fastapi_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # Streaming endpoints (if any)
    location /stream/ {
      proxy_pass http://fastapi_upstream;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # Static: marketing (optional)
    location /mkt/ {
      alias /srv/marketing/;
      try_files $uri $uri/ =404;
      autoindex off;
    }

    # SPA
    root /srv/spa/dist;
    index index.html;
    autoindex off;
    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # ---------------- HTTPS: STAGING (staging.lexbot.pro) ----------------
  server {
    listen 443 ssl http2;
    server_name staging.lexbot.pro;

    # TLS certs for staging subdomain (Let's Encrypt).
    # Obtain via certbot (or use a Cloudflare Origin cert and update the paths).
    ssl_certificate     /etc/letsencrypt/live/staging.lexbot.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.lexbot.pro/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($blocked_agent) { return 403; }
    limit_req zone=perip burst=20 nodelay;

    # Deny secrets & dotfiles
    location ~ /\.(?!well-known)(.*)$ { deny all; }
    location = /.env               { deny all; }
    location ~* \.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }
    location ~* (^|/)(composer\.(json|lock)|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|tsconfig(\..*)?\.json|vite\.config\.(js|ts)|webpack.*|Dockerfile|docker-compose\.ya?ml)$ { deny all; }
    location ~* ^/(vendor|node_modules|__pycache__|tests?|docs?)(/|$) { deny all; }

    # Proxy app/API (points to the same upstream; isolate via env on backend if needed)
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # SPA (can use same dist or a different path if you deploy separate assets)
    root /srv/spa/dist;
    index index.html;
    autoindex off;
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
