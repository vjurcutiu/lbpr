worker_processes auto;

events { worker_connections 2048; }

http {
  # Allow larger uploads (audio/video for transcription, OCR, etc.)
  client_max_body_size 50m;
  client_body_timeout 300s;

  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time '
                  'uht=$upstream_header_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # NOTE: nginx UA blocking + rate limiting are disabled; rely on Cloudflare/WAF instead.

  # WebSocket helper
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Upstreams
  upstream fastapi_upstream { server api:8000; keepalive 64; }

  # ---- Cloudflare real IP restore ----
  include /etc/nginx/conf.d/cloudflare-real-ip.conf;

  # Default vhost: drop unknown hosts quickly
  server {
    listen 80 default_server;
    return 444;
  }

  # ---------------- HTTP (80): redirect only ----------------
  server {
    listen 80;
    server_name lexbot.pro *.lexbot.pro;
    location / { return 301 https://$host$request_uri; }
  }

  # Common TLS (single Cloudflare Origin certificate for all hosts)
  # Put the wildcard/apex cert & key at /etc/ssl/cf-origin/
  map $host $tls_cert { default /etc/ssl/cf-origin/lexbot.pro-origin.pem; }
  map $host $tls_key  { default /etc/ssl/cf-origin/lexbot.pro-origin.key; }

  # ---------------- HTTPS: PROD (Marketing static site — currently disabled) ----------------
