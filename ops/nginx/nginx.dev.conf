worker_processes auto;

events { worker_connections 1024; }

http {
  include       mime.types;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # (Optional) quiet some scanners from dev logs
  map $http_user_agent $blocked_agent {
    default 0;
    ~*CensysInspect 1;
    ~*zgrab 1;
    ~*Go-http-client 1;
  }

  upstream fastapi_upstream { server api:8000; keepalive 32; }
  upstream vite_upstream    { server spa:5173;  keepalive 32; }

  server {
    listen 80;
    server_name app.localhost;

    if ($blocked_agent) { return 403; }

    # ---------------- Security hardening (scoped) ----------------
    # Only block *top-level* dotfiles (/.env, /.git, etc.).
    # Do NOT block nested dot-dirs used by Vite: /node_modules/.vite, /.pnpm
    location ~ ^/\.(?!well-known)(.*)$ { deny all; }

    # Block common sensitive extensions (top-level paths only)
    location = /.env               { deny all; }
    location ~* ^/[^/]+\.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }

    # ---------------- API → FastAPI ----------------
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
      proxy_cache off;
    }

    # ---------------- App → Vite dev server (HMR + assets) ----------------
    # Everything else goes to Vite. We must preserve $host and upgrade WS.
    location / {
      proxy_pass http://vite_upstream;
      proxy_http_version 1.1;

      # Preserve original host so Vite allowedHosts logic passes
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # HMR websocket upgrade
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_redirect off;
    }
  }
}
