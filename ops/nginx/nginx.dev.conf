worker_processes auto;

events { worker_connections 1024; }

http {
  # Allow larger uploads (audio/video for transcription, OCR, etc.)
  client_max_body_size 50m;
  client_body_timeout 300s;

  include       mime.types;
  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # NOTE: UA blocking removed (handled by Cloudflare/WAF in prod).

  upstream fastapi_upstream { server api:8000; keepalive 32; }
  upstream vite_upstream    { server spa:5173;  keepalive 32; }

  server {
    listen 80;
    server_name app.localhost;
    # ---------------- Security hardening (scoped) ----------------
    # Only block *top-level* dotfiles (/.env, /.git, etc.).
    # Do NOT block nested dot-dirs used by Vite: /node_modules/.vite, /.pnpm
    location ~ ^/\.(?!well-known)(.*)$ { deny all; }

    # Block common sensitive extensions (top-level paths only)
    location = /.env               { deny all; }
    location ~* ^/[^/]+\.(env|ini|log|bak|old|sql|sqlite|yml|yaml|toml|pem|key|crt)$ { deny all; }

    # --- Admin-only endpoints (blocked at the edge) --------------------------
    # Magic-link creation is an admin function. Use the in-container CLI:
    #   python admin_magic_link.py --phone ...
    location = /api/auth/magic/create     { return 404; }
    location = /api/v1/auth/magic/create  { return 404; }

    # ---------------- API → FastAPI ----------------
    location /api/ {
      proxy_pass http://fastapi_upstream/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_redirect off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
    }

    # ---------------- App → Vite dev server (HMR + assets) ----------------
    # Everything else goes to Vite. We must preserve $host and upgrade WS.
    location / {
      proxy_pass http://vite_upstream;
      proxy_http_version 1.1;

      # Preserve original host so Vite allowedHosts logic passes
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # HMR websocket upgrade
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_redirect off;
    }
  }
}
