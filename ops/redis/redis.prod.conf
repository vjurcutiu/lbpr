# --- Redis hardened config (LBPR • PROD) ---
# Safer defaults. We disable FLUSH* so no one can wipe the DB at runtime.

port 6379
bind 0.0.0.0
protected-mode yes

# ----- Persistence (AOF + some RDB for faster restarts) -----
dir /data
appendonly yes
appendfsync everysec
aof-load-truncated yes

save 900 1
save 300 10
save 60 10000

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- Hardening: disable high‑risk commands ----
# Prevent malicious reconfiguration into replica / exfiltration
rename-command REPLICAOF ""
rename-command SLAVEOF ""
# Prevent runtime config tampering / rewrite
rename-command CONFIG ""
# Prevent destructive wipes & accidental shutdowns
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN ""
