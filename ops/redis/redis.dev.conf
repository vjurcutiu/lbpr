# --- Redis config (LBPR • DEV) ---
# Safer defaults, but allow FLUSH* in dev so old AOFs that contain it can load.
# Do NOT expose dev Redis publicly.

port 6379
bind 0.0.0.0
protected-mode yes

# ----- Persistence (AOF + some RDB for faster restarts) -----
dir /data
appendonly yes
appendfsync everysec
aof-load-truncated yes

save 900 1
save 300 10
save 60 10000

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- Hardening: keep risky reconfig & shutdown disabled (but allow FLUSH* here) ----
rename-command REPLICAOF ""
rename-command SLAVEOF ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
