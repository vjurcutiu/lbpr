# --- Redis hardened config (LBPR) ---
# Network
port 6379
bind 0.0.0.0
protected-mode yes

# Persistence (AOF + some RDB for faster restarts)
dir /data
appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- Hardening: disable high-risk commands ----
# Prevent malicious reconfiguration into replica / exfiltration
rename-command REPLICAOF ""
rename-command SLAVEOF ""
# Prevent runtime config tampering / rewrite
rename-command CONFIG ""
# Prevent destructive wipes & accidental shutdowns
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command SHUTDOWN ""

# NOTE: DO NOT disable EVAL/EVALSHA — the app uses Lua scripts for rate-limits.
# If you want to go further, configure ACLs instead of 'requirepass' and grant a minimal command set.
