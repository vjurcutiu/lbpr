# --- Redis persistence for usage limits ---
# Keep both AOF (append-only) and periodic RDB snapshots, so data survives container restarts.
# Data directory is /data, which is backed by a Docker volume in compose.

dir /data

# Append Only File: durable and safe. "everysec" is a good durability/latency trade-off.
appendonly yes
appendfsync everysec

# Also keep a few RDB snapshots for faster restarts (optional but recommended).
save 900 1
save 300 10
save 60 10000

# Avoid huge rewrites too often; defaults are fine, but keep here for clarity.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
