version: "3.9"
services:
  api:
    image: "docker.io/${DOCKERHUB_USERNAME}/lbpr-api:${API_TAG}"
    command: >-
      opentelemetry-instrument uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers
    # keep other settings (env_file, volumes, healthcheck) from base compose

  # nginx uses built assets from ./static/spa (populated by deploy.sh)
