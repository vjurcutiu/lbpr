version: "3.9"

services:
  api:
    # Placeholder Doppler override.
    # We no longer run `doppler` inside the container to avoid coupling the image
    # to external package repos at build time.
    # API configuration still comes from:
    #   - ./backend/.env        (SERVER_BACKEND_ENV from GitHub secrets)
    #   - ./.env                (SERVER_ROOT_ENV for shared values like REDIS_PASSWORD)
    # This file is kept so deploy.sh can safely include it when DOPPLER_TOKEN is present.
    # You can later reintroduce a `command:` override here if you decide
    # to wrap docker compose with `doppler run` on the host.
    environment:
      - DOPPLER_ENABLED=true
