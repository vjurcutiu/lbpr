version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static/marketing:/srv/marketing:ro
      - ./static/spa:/srv/spa:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./ops/certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [appnet]

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks: [appnet]
    volumes:
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
