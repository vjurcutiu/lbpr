version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx config + site assets
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static/marketing:/srv/marketing:ro
      - ./static/spa:/srv/spa:ro

      # SSL certs issued on the host by certbot (read-only in container)
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # Webroot for HTTP-01 challenges so renewals work without stopping nginx
      - ./ops/certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [appnet]

  redis:
    image: redis:7.2-alpine
    command: ["redis-server","--save",""]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"   # optional for debugging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"  # optional direct access
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks: [appnet]
    volumes:
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
