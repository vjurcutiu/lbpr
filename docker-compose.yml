version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/snippets/cloudflare-real-ip.conf:/etc/nginx/conf.d/cloudflare-real-ip.conf:ro
      - ./static/marketing:/srv/marketing:ro
      - ./static/spa:/srv/spa:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./ops/certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [appnet]

  redis:
    image: redis:7.2-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set in .env}
    command:
      - sh
      - -lc
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
      - ./ops/redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
      # Google client libraries (DLP/KMS/etc.) use Application Default Credentials (ADC).
      # Point ADC at the same service account JSON we already mount for Firebase Admin.
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase_sa.json
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks: [appnet]
    volumes:
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
