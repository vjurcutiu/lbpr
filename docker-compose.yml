version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static/marketing:/srv/marketing:ro
      - ./static/spa:/srv/spa:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [appnet]

  # 🔴 New: Redis service for caching/queues/rate limits
  redis:
    image: redis:7.2-alpine
    command: ["redis-server","--save",""]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"   # optional: expose for local debugging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"  # optional: hit API directly if needed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks: [appnet]
    volumes:
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
