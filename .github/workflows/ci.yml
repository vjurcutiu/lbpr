name: CI — Build, Push, and Deploy (Self-hosted runner, no SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  LOCAL_DEPLOY_DIR: /opt/lbpr

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Linux, X64, oci-prod]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Docker info (runner sanity check)
        run: |
          set -euo pipefail
          whoami
          hostname
          docker version
          docker info | head -n 40 || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DOPPLER_TOKEN_API }}" ]; then
            echo "DOPPLER_TOKEN_API is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.DOPPLER_TOKEN_SPA }}" ]; then
            echo "DOPPLER_TOKEN_SPA is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.DOPPLER_PROJECT }}" ]; then
            echo "DOPPLER_PROJECT is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.DOPPLER_CONFIG }}" ]; then
            echo "DOPPLER_CONFIG is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.GRAFANA_URL }}" ]; then
            echo "GRAFANA_URL is not set" >&2
            exit 1
          fi
          if [ -z "${{ secrets.GRAFANA_AUTH }}" ]; then
            echo "GRAFANA_AUTH is not set" >&2
            exit 1
          fi

      - name: Compute image tags (sha-*)
        id: tags
        run: |
          set -euo pipefail
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "api_tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "spa_tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "site_tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/lbpr-api:${{ steps.tags.outputs.api_tag }}

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Generate SPA .env from Doppler
        working-directory: static/spa
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_SPA }}
        run: |
          set -euo pipefail
          doppler secrets download --no-file --format env > .env.production
          echo "SPA .env.production generated with $(wc -l < .env.production) entries"

      - name: Validate SPA env (Firebase)
        working-directory: static/spa
        run: |
          set -euo pipefail
          if [ ! -f .env.production ]; then
            echo "[SPA ENV] ERROR: .env.production not found" >&2
            ls -la
            exit 1
          fi
          required_vars=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_MESSAGING_SENDER_ID
          )
          echo "[SPA ENV] Validating Firebase vars in .env.production"
          for var in "${required_vars[@]}"; do
            line=$(grep "^$var=" .env.production || true)
            value=${line#"$var="}
            if [ -z "$line" ]; then
              echo "[SPA ENV] ERROR: $var is missing in .env.production" >&2
              exit 1
            fi
            if [ -z "$value" ]; then
              echo "[SPA ENV] ERROR: $var is empty in .env.production" >&2
              exit 1
            fi
            echo "[SPA ENV] $var present (length ${#value})"
          done
          echo "[SPA ENV] Firebase env validation OK"

      - name: Build and push SPA image
        uses: docker/build-push-action@v6
        with:
          context: ./static/spa
          file: ./static/spa/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/lbpr-spa:${{ steps.tags.outputs.spa_tag }}
          build-args: |
            CI_FAST_BUILD=1

      - name: Build and push marketing site image
        uses: docker/build-push-action@v6
        with:
          context: ./static/site
          file: ./static/site/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/lbpr-site:${{ steps.tags.outputs.site_tag }}
          build-args: |
            CI_FAST_BUILD=1

      - name: Ensure Terraform runner prerequisites
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            echo "unzip already installed: $(command -v unzip)"
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y unzip
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y unzip
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y unzip
          elif command -v apk >/dev/null 2>&1; then
            sudo apk add --no-cache unzip
          elif command -v zypper >/dev/null 2>&1; then
            sudo zypper --non-interactive install unzip
          else
            echo "Could not install unzip automatically on this runner. Please preinstall unzip on the self-hosted runner image." >&2
            exit 1
          fi

          unzip -v | head -n 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Validate Grafana Terraform
        working-directory: infra/terraform/grafana
        env:
          TF_VAR_grafana_url: ${{ secrets.GRAFANA_URL }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
        run: |
          set -euo pipefail
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Prepare local deploy bundle
        run: |
          set -euo pipefail

          mkdir -p _deploy/ops/deploy
          mkdir -p _deploy/ops/nginx/snippets
          mkdir -p _deploy/ops/certs
          mkdir -p _deploy/ops/redis
          mkdir -p _deploy/backend
          mkdir -p _deploy/static

          cp docker-compose.yml _deploy/
          if [ -f docker-compose.ssl.yml ]; then
            cp docker-compose.ssl.yml _deploy/
          fi

          if [ -d static/marketing ]; then
            cp -R static/marketing _deploy/static/
          fi

          cp ops/nginx/nginx.conf _deploy/ops/nginx/nginx.conf
          if [ -f ops/nginx/snippets/cloudflare-real-ip.conf ]; then
            cp ops/nginx/snippets/cloudflare-real-ip.conf _deploy/ops/nginx/snippets/cloudflare-real-ip.conf
          fi

          mkdir -p _deploy/ops/certs/cf-origin
          printf "%s\n" "${{ secrets.CF_ORIGIN_CERT_LEXBOT_PRO }}" > _deploy/ops/certs/cf-origin/lexbot.pro-origin.pem
          printf "%s\n" "${{ secrets.CF_ORIGIN_KEY_LEXBOT_PRO }}" > _deploy/ops/certs/cf-origin/lexbot.pro-origin.key

          if [ -d ops/certbot-www ]; then
            cp -R ops/certbot-www _deploy/ops/
          fi

          if [ -f ops/redis/redis.prod.conf ]; then
            cp ops/redis/redis.prod.conf _deploy/ops/redis/redis.prod.conf
          fi

          cp ops/deploy/docker-compose.deploy.yml _deploy/ops/deploy/docker-compose.deploy.yml
          cp ops/deploy/docker-compose.doppler.yml _deploy/ops/deploy/docker-compose.doppler.yml
          cp ops/deploy/deploy.sh _deploy/ops/deploy/deploy.sh
          chmod +x _deploy/ops/deploy/deploy.sh

          printf "%s" "${{ secrets.SERVER_ROOT_ENV }}" > _deploy/.env

          export DOPPLER_TOKEN="${{ secrets.DOPPLER_TOKEN_API }}"
          doppler secrets download --no-file --format env > _deploy/backend/.env
          echo "[deploy] backend/.env generated from Doppler with $(wc -l < _deploy/backend/.env) entries"

          if [ -n "${{ secrets.FIREBASE_SA_JSON_B64 }}" ]; then
            echo "${{ secrets.FIREBASE_SA_JSON_B64 }}" | base64 -d > _deploy/backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json
          fi

      - name: Sync bundle into LOCAL_DEPLOY_DIR
        run: |
          set -euo pipefail
          sudo mkdir -p "${LOCAL_DEPLOY_DIR}"
          sudo rsync -av --delete _deploy/ "${LOCAL_DEPLOY_DIR}/"
          sudo chown -R "$(id -u):$(id -g)" "${LOCAL_DEPLOY_DIR}"

      - name: Deploy locally (no SSH)
        working-directory: ${{ env.LOCAL_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
          export API_TAG='${{ steps.tags.outputs.api_tag }}'
          export SPA_TAG='${{ steps.tags.outputs.spa_tag }}'
          export SITE_TAG='${{ steps.tags.outputs.site_tag }}'

          echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login --username '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin || true

          echo 'DOPPLER_PROJECT=${{ secrets.DOPPLER_PROJECT }}' > .deploy.env
          echo 'DOPPLER_CONFIG=${{ secrets.DOPPLER_CONFIG }}' >> .deploy.env
          echo 'DOPPLER_ENABLED=1' >> .deploy.env

          bash ops/deploy/deploy.sh

      - name: Apply Grafana dashboards
        working-directory: infra/terraform/grafana
        env:
          TF_VAR_grafana_url: ${{ secrets.GRAFANA_URL }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_AUTH }}
        run: |
          set -euo pipefail
          terraform init
          terraform apply -auto-approve

      - name: Post-deploy API health check
        working-directory: ${{ env.LOCAL_DEPLOY_DIR }}
        run: |
          set -euo pipefail

          HEALTH_URL="${{ secrets.PROD_HEALTHCHECK_URL }}"
          if [ -n "$HEALTH_URL" ]; then
            echo "Checking external health URL: $HEALTH_URL"
            curl --fail --silent --show-error --max-time 20 "$HEALTH_URL" >/dev/null
            echo "External API health check OK"
            exit 0
          fi

          echo "No PROD_HEALTHCHECK_URL set; using internal Docker health check"
          docker compose -f docker-compose.yml -f ops/deploy/docker-compose.deploy.yml exec -T api             wget -qO- http://127.0.0.1:8000/healthz >/dev/null
          echo "Internal API health check OK"
