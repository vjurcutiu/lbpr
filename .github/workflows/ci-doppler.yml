name: CI (Doppler) — Build, Push, and Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  tags:
    name: Compute image tags
    runs-on: ubuntu-latest
    outputs:
      api_tag: ${{ steps.set-tags.outputs.api_tag }}
      spa_tag: ${{ steps.set-tags.outputs.spa_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: set-tags
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
            API_TAG="branch-${SAFE_BRANCH}"
            SPA_TAG="branch-${SAFE_BRANCH}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            API_TAG="sha-${SHORT_SHA}"
            SPA_TAG="sha-${SHORT_SHA}"
          fi

          echo "api_tag=${API_TAG}" >> "$GITHUB_OUTPUT"
          echo "spa_tag=${SPA_TAG}" >> "$GITHUB_OUTPUT"

          echo "API_TAG=${API_TAG}"
          echo "SPA_TAG=${SPA_TAG}"

  build-api:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: [tags]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lbpr-api:${{ needs.tags.outputs.api_tag }}

  build-spa:
    name: Build & Push SPA
    runs-on: ubuntu-latest
    needs: [tags]
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push SPA image
        uses: docker/build-push-action@v6
        with:
          context: ./static/spa
          file: ./static/spa/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lbpr-spa:${{ needs.tags.outputs.spa_tag }}

  deploy:
    name: Deploy to Hetzner (Doppler)
    runs-on: ubuntu-latest
    needs: [build-api, build-spa, tags]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Doppler secrets
        env:
          DOPPLER_TOKEN_API: ${{ secrets.DOPPLER_TOKEN_API }}
          DOPPLER_TOKEN_SPA: ${{ secrets.DOPPLER_TOKEN_SPA }}
        run: |
          set -euo pipefail

          required=(DOPPLER_TOKEN_API DOPPLER_TOKEN_SPA)
          missing=0

          for key in "${required[@]}"; do
            # Indirect expansion: ${!key} = value of the env var whose name is in $key
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "Required Doppler secrets missing. Failing."
            exit 1
          fi


      - name: Prepare deploy bundle
        run: |
          set -euo pipefail

          mkdir -p _deploy/ops/deploy
          cp docker-compose.yml _deploy/
          if [ -f docker-compose.ssl.yml ]; then cp docker-compose.ssl.yml _deploy/; fi
          mkdir -p _deploy/static
          if [ -d static/marketing ]; then cp -R static/marketing _deploy/static/; fi
          cp ops/deploy/docker-compose.deploy.yml _deploy/ops/deploy/docker-compose.deploy.yml
          cp ops/deploy/docker-compose.doppler.yml _deploy/ops/deploy/docker-compose.doppler.yml
          cp ops/deploy/deploy.sh _deploy/ops/deploy/deploy.sh
          chmod +x _deploy/ops/deploy/deploy.sh

          touch _deploy/.env
          touch _deploy/backend/.env

      - name: Upload deploy bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: _deploy

      - name: Download deploy bundle (self)
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: _deploy

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add Hetzner to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.HETZNER_SSH_PORT }}" "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync deploy bundle to Hetzner
        run: |
          REMOTE_BASE="${{ secrets.REMOTE_DIR || '/opt/lbpr' }}"
          rsync -az --delete _deploy/ "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:${REMOTE_BASE}/"

      - name: Run remote deploy
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          API_TAG: ${{ needs.tags.outputs.api_tag }}
          SPA_TAG: ${{ needs.tags.outputs.spa_tag }}
          DOPPLER_PROJECT: ${{ vars.DOPPLER_PROJECT }}
          DOPPLER_CONFIG: ${{ vars.DOPPLER_CONFIG }}
        run: |
          set -euo pipefail
          REMOTE_BASE="${{ secrets.REMOTE_DIR || '/opt/lbpr' }}"

          ssh -p "${{ secrets.HETZNER_SSH_PORT }}" "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" "
            set -euo pipefail
            cd "${REMOTE_BASE}"

            export DOCKERHUB_USERNAME='${{ env.DOCKERHUB_USERNAME }}'
            export API_TAG='${{ env.API_TAG }}'
            export SPA_TAG='${{ env.SPA_TAG }}'

            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login --username '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin || true

            echo 'DOPPLER_PROJECT=${{ env.DOPPLER_PROJECT }}' > .deploy.env
            echo 'DOPPLER_CONFIG=${{ env.DOPPLER_CONFIG }}' >> .deploy.env
            echo 'DOPPLER_ENABLED=1' >> .deploy.env

            bash ops/deploy/deploy.sh
          "
