#cloud-config
package_update: true
package_upgrade: true

users:
  - default
  - name: ${deploy_user}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [adm, sudo]
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_authorized_key}

runcmd:
  - [ bash, -lc, "install -m 0755 -d /etc/apt/keyrings" ]
  - [ bash, -lc, "apt-get update && apt-get install -y ca-certificates curl gnupg" ]
  - [ bash, -lc, "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg" ]
  - [ bash, -lc, "chmod a+r /etc/apt/keyrings/docker.gpg" ]
  - [ bash, -lc, 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null' ]
  - [ bash, -lc, "apt-get update" ]
  - [ bash, -lc, "apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" ]
  - [ bash, -lc, "usermod -aG docker ${deploy_user}" ]
  - [ systemctl, enable, docker ]
  - [ systemctl, start, docker ]
  - [ bash, -lc, "mkdir -p /opt/lbpr && chown -R ${deploy_user}:${deploy_user} /opt/lbpr" ]