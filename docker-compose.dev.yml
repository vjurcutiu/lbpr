version: "3.9"

services:
  spa:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile=false && DOCKER_DEV=1 pnpm dev --host --strictPort"
    environment:
      - NODE_ENV=development
      - DOCKER_DEV=1
      - VITE_API_BASE_URL=/api
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=250
    volumes:
      - ./static/spa:/app
      - /app/node_modules
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/@vite/client >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 50
    networks: [appnet]

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    environment:
      - PYTHONUNBUFFERED=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
    volumes:
      - ./backend:/app
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 50
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      spa:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks: [appnet]

networks:
  appnet:
    driver: bridge
