version: "3.9"

services:
  spa:
    build:
      context: ./static/spa
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -lc "DOCKER_DEV=1 pnpm dev --host --strictPort"
    environment:
      - NODE_ENV=development
      - DOCKER_DEV=1
      - VITE_API_BASE_URL=/api
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=150
    volumes:
      - ./static/spa/src:/app/src
      - ./static/spa/public:/app/public
      - ./static/spa/index.html:/app/index.html
      - ./static/spa/vite.config.ts:/app/vite.config.ts
      - ./static/spa/tailwind.config.ts:/app/tailwind.config.ts
      - ./static/spa/postcss.config.cjs:/app/postcss.config.cjs
      - ./static/spa/tsconfig.json:/app/tsconfig.json
      - ./static/spa/tsconfig.app.json:/app/tsconfig.app.json         # <-- add this
      # If you also have a node/ts-node config:
      - ./static/spa/tsconfig.node.json:/app/tsconfig.node.json       # <-- optional
      - ./static/spa/.env:/app/.env                                  # optional
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/@vite/client >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 50
    networks: [appnet]

  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    environment:
      - PYTHONUNBUFFERED=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
    volumes:
      - ./backend:/app
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 50
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      spa:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks: [appnet]

networks:
  appnet:
    driver: bridge
