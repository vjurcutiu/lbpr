version: "3.9"

services:
  spa:
    build:
      context: ./static/spa
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -lc "DOCKER_DEV=1 pnpm dev --host --strictPort"
    environment:
      - NODE_ENV=development
      - DOCKER_DEV=1
      - VITE_API_BASE_URL=/api
      - CHOKIDAR_USEPOLLING=1
      - CHOKIDAR_INTERVAL=150
    volumes:
      - ./static/spa/src:/app/src
      - ./static/spa/public:/app/public
      - ./static/spa/index.html:/app/index.html
      - ./static/spa/vite.config.ts:/app/vite.config.ts
      - ./static/spa/tailwind.config.ts:/app/tailwind.config.ts
      - ./static/spa/postcss.config.cjs:/app/postcss.config.cjs
      - ./static/spa/tsconfig.json:/app/tsconfig.json
      - ./static/spa/tsconfig.app.json:/app/tsconfig.app.json
      - ./static/spa/tsconfig.node.json:/app/tsconfig.node.json
      - ./static/spa/.env:/app/.env
    expose: ["5173"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/@vite/client >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 50
    networks: [appnet]

  # Redis (dev) — not exposed, password required
  redis:
    image: redis:7.2-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set in .env}
    command: ["sh","-lc","exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

  api:
    build: ./backend
    command: >
      sh -lc "uvicorn main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app
      --reload-exclude 'venv/*'
      --reload-exclude '.venv/*'
      --reload-exclude 'node_modules/*'
      --reload-exclude '.git/*'
      --no-access-log"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_DEV=1
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_sa.json
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./backend:/app
      - ./backend/lexbot-pro-firebase-adminsdk-fbsvc-40d434171d.json:/run/secrets/firebase_sa.json:ro
    expose: ["8000"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 50
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      spa:
        condition: service_healthy
      api:
        condition: service_healthy
    ports: ["80:80"]
    volumes:
      - ./ops/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  redis-data:
