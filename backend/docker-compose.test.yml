services:
  api-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      PYTHONUNBUFFERED: "1"
      SKIP_FIREBASE_INIT: "1"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
    networks: [appnet]

  # Test Redis with persistence enabled, backed by ephemeral test volume
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - test-redis-data:/data
      - ./ops/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  test-redis-data:
