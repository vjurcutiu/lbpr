services:
  api-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      PYTHONUNBUFFERED: "1"
      SKIP_FIREBASE_INIT: "1"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
    networks: [appnet]

  # New: test Redis
  redis:
    image: redis:7.2-alpine
    command: ["redis-server","--save",""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [appnet]

networks:
  appnet:
    driver: bridge
